[package]
name = "plotter"
version = "0.1.0"
edition = "2021"

[dependencies]
rusqlite = { version = "0.29", features = ["bundled"] }
image = { version = "0.24", default-features = false, features = ["png","jpeg"] }
lru = "0.10"
anyhow = "1.0"
sdl2 = { version = "0.38.0", features = ["ttf", "gfx", "unsafe_textures"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = "0.3"
url = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
chrono = "0.4.45"

# Windows: link SDL2, SDL2_ttf and SDL2_gfx statically from vcpkg (see WINDOWS_BUILD.md).
# Linux keeps using the system libraries installed with apt.
[target.'cfg(windows)'.dependencies]
sdl2 = { version = "0.38.0", features = ["use-vcpkg", "static-link"] }

[package.metadata.vcpkg]
dependencies = ["sdl2", "sdl2-ttf", "sdl2-gfx"]
git = "https://github.com/microsoft/vcpkg"
rev = "2026.10.16"

[package.metadata.vcpkg.target]
x86_64-pc-windows-msvc = { triplet = "x64-windows-static-md" }
