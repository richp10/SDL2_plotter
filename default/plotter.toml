[signalk]
url = "ws://192.168.3.2/signalk/v1/stream?subscribe=none"

[signalk.paths]
position = "navigation.position"
course_over_ground = "navigation.courseOverGroundLastMinute"
speed_over_ground = "navigation.speedOverGroundLastMinute"
ais_position = "navigation.position"
ais_name = "name"
ais_course_over_ground = "navigation.courseOverGroundTrue"
ais_speed_over_ground = "navigation.speedOverGround"

[charts]
directory = "map"
default = "assets/OSM.mbtiles"

[window]
title = "KALYMNOS"
fullscreen = false
width = 1600
height = 800

[fonts]
file = "assets/Montserrat-Regular.ttf"
window_size = 28
ui_size = 16

[appearance]
# Sizes and line widths are in pixels.
boat_size = 6
boat_circle_radius = 50
mark_size = 6
route_point_size = 6
route_width = 3
cog_length = 250.0
cog_width = 4
ais_course_length = 28
ais_course_width = 3
ais_size = 7
ais_outline_size = 9
# Colors use [red, green, blue, alpha], with values from 0 to 255.
boat_color = [0, 0, 255, 255]
measure_color = [0, 0, 255, 255]
route_color = [255, 0, 0, 255]
track_color = [255, 0, 0, 255]
waypoint_color = [220, 30, 30, 255]
coverage_color = [255, 140, 0, 255]
cog_color = [0, 0, 255, 255]
ais_color = [255, 140, 0, 255]
ais_outline_color = [0, 0, 0, 255]
map_background_color = [250, 250, 250, 255]
line_color = [0, 0, 255, 255]
night_overlay_color = [255, 0, 0, 255]

[rendering]
tile_cache_size = 512
prefetch_margin = 2

[track]
checkpoint_interval_seconds = 15

[streaming]
enabled = true
bind_address = "127.0.0.1"
port = 8090
fps = 5
jpeg_quality = 70
